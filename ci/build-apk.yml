name: Build Android APK (PriceRadar)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PriceRadar-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PriceRadar Android v1.0.${{ github.run_number }}
          body: |
            ### 📱 PriceRadar Android APK
            
            Автоматическая сборка мобильного приложения для Android.
            
            - **Файл**: `PriceRadar-debug.apk`
            - **Сборка**: GitHub Actions Run #${{ github.run_number }}
            - **Автономная работа**: Приложение содержит встроенный интерфейс и работает сразу после установки без необходимости запуска локального сервера на компьютере.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
